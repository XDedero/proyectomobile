{% load static %}
<link id="companyThemeStyles" rel="stylesheet" href="{% static 'mobileApp/company-theme.css' %}?v={{ asset_version }}">
{% if company_theme %}
<style id="companyThemeTokens">
    :root {
        --company-primary: {{ company_theme.primary }};
        --company-primary-rgb: {{ company_theme.primary_rgb }};
        --company-hover: {{ company_theme.hover }};
        --company-hover-rgb: {{ company_theme.hover_rgb }};
        --company-pressed: {{ company_theme.pressed }};
        --company-ink: {{ company_theme.ink }};
        --company-ink-rgb: {{ company_theme.ink_rgb }};
        --company-muted: {{ company_theme.muted }};
        --company-soft: {{ company_theme.soft }};
        --company-surface: {{ company_theme.surface }};
        --company-border: {{ company_theme.border }};
        --company-background: {{ company_theme.background }};
        --company-header: {{ company_theme.header }};
    }
</style>
{% endif %}
